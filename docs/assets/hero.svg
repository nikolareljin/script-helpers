<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d">
  <title id="t">script-helpers</title>
  <desc id="d">Reusable Bash and PowerShell helpers: logging, docker, dialog, files, JSON, ports, devices, packaging. 36 Bash modules, 29 PowerShell mirrors, runs unchanged on the bash 3.2 macOS ships.</desc>
  <!--
    Hero banner for the README and the documentation site.

    Built from docs/assets/logo.svg — same mark, same gradient, same dark
    ground as the site header (#0b0e14). Its sibling in ci-helpers is the same
    layout with a different mark and accent, so the two read as one family.

    Fixed width/height as well as a viewBox, unlike logo.svg: GitHub renders a
    README image at its intrinsic size, and a bare viewBox leaves that
    undefined. The viewBox still lets the docs site scale it fluidly.

    The numbers are real and were counted at 0.30.0. Chip widths are derived
    from the monospace advance (0.6em) rather than eyeballed — the first
    attempt in the sibling repo clipped a label mid-word.

    No <style> block and no external font file: SVG text uses the viewer's own
    fonts, so the stacks below name generic families that exist everywhere.
  -->
  <defs>
    <linearGradient id="sh-hero-grad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0"   stop-color="#3080D0"/>
      <stop offset="0.5" stop-color="#40A0A0"/>
      <stop offset="1"   stop-color="#60D070"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="340" rx="16" fill="#0b0e14"/>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="15.5" fill="none" stroke="#222a36"/>

  <!-- The mark, from logo.svg on a 64 grid, scaled 2.6x. -->
  <g transform="translate(60 86) scale(2.6)">
    <g fill="none" stroke="url(#sh-hero-grad)" stroke-width="5"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 15 L23 32 L7 49"/>
      <path d="M23 32 H31"/>
      <circle cx="41" cy="32" r="11"/>
    </g>
    <g fill="url(#sh-hero-grad)">
      <g transform="translate(41 32)">
        <rect x="-2.6" y="-16.5" width="5.2" height="6" rx="1.2"/>
        <rect x="-2.6" y="-16.5" width="5.2" height="6" rx="1.2" transform="rotate(45)"/>
        <rect x="-2.6" y="-16.5" width="5.2" height="6" rx="1.2" transform="rotate(90)"/>
        <rect x="-2.6" y="-16.5" width="5.2" height="6" rx="1.2" transform="rotate(135)"/>
        <rect x="-2.6" y="-16.5" width="5.2" height="6" rx="1.2" transform="rotate(180)"/>
        <rect x="-2.6" y="-16.5" width="5.2" height="6" rx="1.2" transform="rotate(225)"/>
        <rect x="-2.6" y="-16.5" width="5.2" height="6" rx="1.2" transform="rotate(270)"/>
        <rect x="-2.6" y="-16.5" width="5.2" height="6" rx="1.2" transform="rotate(315)"/>
      </g>
      <circle cx="41" cy="32" r="4"/>
    </g>
  </g>

  <text x="290" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="58" font-weight="700" fill="#e6edf3" letter-spacing="-1">script-helpers</text>

  <rect x="290" y="150" width="86" height="3" rx="1.5" fill="#e3b341"/>

  <text x="290" y="196" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="25" fill="#c9d1d9">Reusable Bash and PowerShell helpers.</text>
  <text x="290" y="231" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="25" fill="#8b98a8">Logging, docker, devices, packaging — source what you need.</text>

  <!-- Facts. Counted at 0.30.0. -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">
    <rect x="290" y="258" width="180" height="34" rx="6" fill="#11161f" stroke="#222a36"/>
    <text x="304" y="281" fill="#e3b341">36</text>
    <text x="333" y="281" fill="#8b98a8">Bash modules</text>

    <rect x="484" y="258" width="241" height="34" rx="6" fill="#11161f" stroke="#222a36"/>
    <text x="498" y="281" fill="#e3b341">29</text>
    <text x="527" y="281" fill="#8b98a8">PowerShell mirrors</text>

    <rect x="739" y="258" width="282" height="34" rx="6" fill="#11161f" stroke="#222a36"/>
    <text x="753" y="281" fill="#e3b341">3.2</text>
    <text x="792" y="281" fill="#8b98a8">bash floor, runs on 5</text>
  </g>
</svg>
