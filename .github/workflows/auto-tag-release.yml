name: Auto tag + release on main

# On merge of a release/X.Y.Z PR into main: detect the version (from the PR's
# release branch), create the bare-SemVer tag, create the GitHub Release, and move
# the floating `production` branch to it. Replaces the previously hand-rolled
# release-tag.yml + auto-tag.yml by reusing the shared ci-helpers workflows.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: auto-tag-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 1) Detect the release version from the merged release/X.Y.Z PR and tag it.
  #    update_production_tag: false — script-helpers has no create_production.sh;
  #    we move the `production` BRANCH ourselves below (consumers track it via
  #    `git submodule add -b production`). No release_workflow dispatch either —
  #    the release is created in-run by the `release` job, avoiding the GITHUB_TOKEN
  #    tag-push trigger restriction.
  tag:
    uses: nikolareljin/ci-helpers/.github/workflows/auto-tag-release.yml@production
    # The reusable workflow's `dispatch` job declares job-level `actions: write`
    # unconditionally (only its execution is gated by `if`), and GitHub validates
    # job permissions statically — so every caller must grant `actions: write`
    # here or the run fails validation before `tag` can execute, even though we
    # leave `release_workflow` unset and the dispatch job is skipped.
    permissions:
      contents: write
      pull-requests: read
      actions: write
    with:
      update_production_tag: false

  # 2) Create the GitHub Release for the new tag (CHANGELOG notes), same run.
  release:
    needs: tag
    if: ${{ needs.tag.outputs.version != '' }}
    permissions:
      contents: write
    uses: nikolareljin/ci-helpers/.github/workflows/create-github-release.yml@production
    with:
      release_tag: ${{ needs.tag.outputs.version }}

  # 3) Move the `production` branch to the new tag (script-helpers ships from a
  #    production branch, not a floating tag).
  # `production` is the branch consumers track (`git submodule add -b production`),
  # so it must follow a final X.Y.Z only. The version pattern accepts
  # release/X.Y.Z-rcN, and this job was gated on the version merely being
  # non-empty -- so cutting a candidate here would have pushed it to every
  # consumer that updates its submodule. That is the same defect ci-helpers
  # just fixed for the floating `production` tag; this is the copy that lives
  # here, in the job this repository runs itself.
  #
  # The test is inline rather than ci-helpers' `is_prerelease` output because
  # that output ships in ci-helpers 0.28.0 and this repository calls
  # @production, which is still 0.27.0. Once 0.28.0 is the production ref, this
  # can become `needs.tag.outputs.is_prerelease != 'true'` and the rule will
  # have one definition again.
  production:
    needs: tag
    if: >-
      ${{ needs.tag.outputs.version != ''
          && !contains(needs.tag.outputs.version, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-19
        with:
          fetch-depth: 0
          fetch-tags: true
      # Delegates to scripts/pin_production.sh rather than repeating the move
      # inline. The two copies had already drifted into carrying the same bug:
      # `git merge --ff-only <ancestor>` reports "Already up to date" and exits
      # 0, so a move that did nothing printed success.
      #
      # Deliberately WITHOUT --allow-rewind. This runs unattended on every
      # release, and a rollback must never be something the automation decides
      # to do. Rolling `production` back is a human running the script with the
      # flag, in the repository that needs it.
      - name: Move production branch to the new tag
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.tag.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/pin_production.sh "$RELEASE_TAG"

  note_candidate:
    needs: tag
    if: >-
      ${{ needs.tag.outputs.version != ''
          && contains(needs.tag.outputs.version, '-') }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Note that the candidate left production alone
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.tag.outputs.version }}
        run: |
          set -euo pipefail
          echo "::notice::Tagged ${RELEASE_TAG}. The production branch was not moved: it follows a final X.Y.Z only, because consumers track it as a submodule branch. Promote deliberately with scripts/pin_production.sh, or by cutting release/${RELEASE_TAG%%-*}."
