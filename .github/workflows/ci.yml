name: CI

on:
  push:
    branches: [ main, master, develop, "release/*" ]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-examples:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-19

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck git-filter-repo

      - name: Environment info
        run: |
          bash --version
          printf "\nmake: "; make --version | head -n1 || true
          printf "\nshellcheck: "; shellcheck --version | head -n1 || true

      - name: Lint shell scripts (ShellCheck)
        run: |
          set -euo pipefail
          files=$(git ls-files '*.sh' || true)
          if [[ -n "$files" ]]; then
            echo "$files" | xargs shellcheck || true
          else
            echo "No shell scripts found."
          fi

      - name: Lint documentation coverage
        run: |
          set -euo pipefail
          make lint-docs

      - name: Run non-interactive examples
        run: |
          make examples

      # The unit test stubs curl; this checks the pinned SHA-256 against the real release.
      - name: Pinned foxguard downloads, matches its SHA-256 and runs
        shell: bash
        run: bash tests/machine/foxguard_release_check.sh

      - name: Run test suite
        run: |
          make test

  # The class of machine and the model picks run under Git Bash on Windows, as
  # ./dev runs them there: /proc/meminfo from Git Bash, GPU memory from the
  # registry through powershell.exe. Only this test file: the rest of the suite
  # targets Linux and macOS.
  windows-ollama-endpoint:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-19
      - name: ollama_endpoint tests under Git Bash
        shell: bash
        run: bash tests/ollama_endpoint_test.sh
      # Git for Windows defaults to core.autocrlf=true; scripts must still check out with LF.
      - name: An autocrlf=true clone checks out LF and its hooks run
        shell: bash
        run: bash tests/line_endings_test.sh
      - name: This machine's figures and class (real, not stubbed)
        shell: bash
        run: bash scripts/ollama_models.sh class

  # The Claude hook and its setup on Windows: Git Bash runs them, as Claude
  # Code does there. setup-hooks.ps1 is the native entry and must find it.
  windows-security-hooks:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-19
      - name: Setup tests under Git Bash
        shell: bash
        run: bash tests/setup_claude_hook_test.sh
      - name: Per-repository setup keeps earlier hooks, under Git Bash
        shell: bash
        run: |
          bash tests/setup_hooks_chain_test.sh
          bash tests/hooks_coexistence_test.sh
          bash tests/setup_agent_hooks_test.sh
      - name: Gate temp-dir and security gate tests under Git Bash
        shell: bash
        run: |
          bash tests/gate_tempdir_test.sh
          bash tests/security_gate_test.sh
      # The unit test stubs curl; this checks the pinned SHA-256 against the real release.
      - name: Pinned foxguard downloads, matches its SHA-256 and runs
        shell: bash
        run: bash tests/machine/foxguard_release_check.sh
      - name: Hook destination and latency tests under Git Bash
        shell: bash
        run: bash tests/claude_hook_destinations_test.sh
      # With native symlinks, so the symlink-out cases run here too.
      - name: Hook destination tests under Git Bash with native symlinks
        shell: bash
        env:
          MSYS: winsymlinks:nativestrict
        run: |
          rc=0
          bash tests/claude_hook_destinations_test.sh 2>&1 | tee "$RUNNER_TEMP/hook-native.log" || rc=$?
          # nativestrict makes ln -s fail rather than copy where symlinks are off.
          if grep -q 'SKIP: ln -s made a copy' "$RUNNER_TEMP/hook-native.log"; then
            echo "native symlinks were not made (runner cannot create them); the symlink cases did not run" >&2
            exit 1
          fi
          exit "$rc"
      - name: setup-hooks.ps1 finds Git Bash and installs (throwaway profile)
        shell: pwsh
        run: |
          $t = Join-Path $env:RUNNER_TEMP 'sh-profile'
          New-Item -ItemType Directory -Force -Path $t | Out-Null
          $env:CLAUDE_CONFIG_DIR = Join-Path $t 'claude'
          $env:LOCALAPPDATA = Join-Path $t 'localappdata'
          $env:GIT_CONFIG_GLOBAL = Join-Path $t 'gitconfig'
          $env:SCRIPT_HELPERS_OWNERS = 'example-owner'
          # A placeholder name list: without one the hook refuses everything.
          $env:XDG_CONFIG_HOME = Join-Path $t 'config'
          New-Item -ItemType Directory -Force -Path (Join-Path $env:XDG_CONFIG_HOME 'script-helpers') | Out-Null
          "# generated: 2026-10-11 source: ci`n# visibility`tnamespace`tname`tcode`tflags`nprivate`texample`tzzqsecretbox`tR-901`t`n" |
            Set-Content -NoNewline -Encoding ascii (Join-Path $env:XDG_CONFIG_HOME 'script-helpers/private-names.tsv')
          New-Item -ItemType File -Force -Path $env:GIT_CONFIG_GLOBAL | Out-Null
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/setup-hooks.ps1 --claude
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $s = Get-Content -Raw (Join-Path $env:CLAUDE_CONFIG_DIR 'settings.json') | ConvertFrom-Json
          $h = $s.hooks.PreToolUse[0].hooks[0]
          Write-Host "command: $($h.command)"
          if ($h.shell -ne 'bash' -or $h.timeout -ne 60 -or $h.command -notmatch 'localappdata/script-helpers/claude-hooks/') { exit 1 }
          # The probes need gitleaks; the runner may have none, so the install
          # is offered and done here, as a person would after the setup.
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/setup-hooks.ps1 --install-gitleaks
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/setup-hooks.ps1 --doctor
          if ($LASTEXITCODE -ne 0) { exit 1 }

  powershell:
    # The PowerShell companion library was never built or linted here, which is
    # how ps/scripts/tag_release.ps1 shipped with a syntax error that made it
    # impossible to load. Parsing every file catches that class of bug.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-19

      - name: Environment info
        shell: pwsh
        run: $PSVersionTable | Format-List

      - name: Parse every PowerShell file
        shell: pwsh
        run: |
          $failed = 0
          # templates/ too: the dev-cli template ships to every repository and
          # was never parsed here.
          Get-ChildItem -Path ps, templates, scripts -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              Write-Host "::error file=$($_.FullName)::$($errors.Count) parse error(s)"
              $errors | ForEach-Object {
                Write-Host "  line $($_.Extent.StartLineNumber): $($_.Message)"
              }
              $failed = 1
            } else {
              Write-Host "ok  $($_.FullName)"
            }
          }
          exit $failed

      - name: Import every module
        shell: pwsh
        run: |
          . ./ps/helpers.ps1
          Import-ScriptHelpersAll
          Write-Host "All PowerShell modules imported cleanly."

      # Parsing and importing cannot see behaviour: the changelog mirror kept a
      # substring match for a release after the Bash module had dropped it.
      - name: Behaviour tests
        shell: pwsh
        run: |
          $failed = 0
          Get-ChildItem -Path ps/tests -Filter *_test.ps1 | ForEach-Object {
            Write-Host "== $($_.Name)"
            pwsh -NoProfile -File $_.FullName
            if ($LASTEXITCODE -ne 0) { $failed = 1 }
          }
          exit $failed
